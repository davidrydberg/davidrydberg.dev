name: Uptime

# External uptime monitor for https://davidrydberg.dev/, defined by the SLI in
# the DAV-5 reliability plan (section 1.3). It runs on GitHub, so it fails
# independently of Paperclip and of Vercel.
#
# A check passes only if ALL of these hold:
#   1. TLS handshake succeeds against a certificate valid for the host
#   2. HTTP status is exactly 200 (redirects are not followed)
#   3. the body contains the literal string `David Rydberg`
#   4. total time is under 5 seconds
#
# Flap control: one failed check waits 60s and retries once. Only the second
# consecutive failure is an outage. On an outage this opens a GitHub issue
# labelled `outage` (or comments on the one already open) and fails the run.
# The first passing check afterwards comments `recovered <UTC>` and closes it;
# those two timestamps are the downtime charged to the error budget.
#
# GitHub cron is best-effort: scheduled runs are routinely delayed, so the
# real interval is longer than 5 minutes. See docs/RUNBOOK.md, "Uptime monitor".
#
# Rollback: delete this file. Nothing else depends on it.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: URL to check (override to force a failure without touching production)
        required: false
        default: https://davidrydberg.dev/

# The built-in GITHUB_TOKEN, scoped to the minimum: read the repo, write issues
# (issues:write also covers creating the `outage` label). No secrets, no PAT.
permissions:
  contents: read
  issues: write

# Runs queue instead of overlapping, so two runs cannot both open an outage
# issue for the same incident.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: check davidrydberg.dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ inputs.url || 'https://davidrydberg.dev/' }}
      MARKER: David Rydberg
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check (retry once after 60s)
        id: check
        run: |
          set -u

          # Prints a one-line verdict and returns 0 on pass, 1 on fail.
          # Leaves the curl write-out in $RUNNER_TEMP/result.$1 and the body
          # in $RUNNER_TEMP/body.$1.
          probe() {
            local n="$1" out rc code secs ip
            out=$(curl --silent --show-error --fail-with-body --max-time 5 \
              --output "$RUNNER_TEMP/body.$n" \
              --write-out '%{http_code} %{time_total} %{remote_ip}' \
              "$URL" 2>"$RUNNER_TEMP/err.$n")
            rc=$?
            read -r code secs ip <<<"$out"
            printf 'http_code=%s time_total=%ss remote_ip=%s curl_exit=%s\n' \
              "${code:-000}" "${secs:-?}" "${ip:-?}" "$rc" >"$RUNNER_TEMP/result.$n"
            if [ "$rc" -ne 0 ]; then
              echo "curl failed (exit $rc): $(head -c 300 "$RUNNER_TEMP/err.$n")" >"$RUNNER_TEMP/verdict.$n"
            elif [ "$code" != "200" ]; then
              echo "HTTP status $code, expected exactly 200" >"$RUNNER_TEMP/verdict.$n"
            elif ! grep -qF -- "$MARKER" "$RUNNER_TEMP/body.$n"; then
              echo "HTTP 200 but body does not contain '$MARKER'" >"$RUNNER_TEMP/verdict.$n"
            else
              echo "pass" >"$RUNNER_TEMP/verdict.$n"
              return 0
            fi
            return 1
          }

          # Per-attempt section of the report: what was checked, what came back.
          describe() {
            local n="$1" ts="$2"
            printf '### Attempt %s (%s)\n\n' "$n" "$ts"
            printf -- '- verdict: %s\n' "$(cat "$RUNNER_TEMP/verdict.$n")"
            printf -- '- %s\n\n' "$(cat "$RUNNER_TEMP/result.$n")"
            if [ -s "$RUNNER_TEMP/err.$n" ]; then
              printf 'curl stderr:\n\n~~~~\n%s\n~~~~\n\n' "$(head -c 500 "$RUNNER_TEMP/err.$n")"
            fi
            if [ -s "$RUNNER_TEMP/body.$n" ]; then
              printf 'Response body (first 500 bytes):\n\n~~~~\n%s\n~~~~\n\n' "$(head -c 500 "$RUNNER_TEMP/body.$n")"
            fi
          }

          ts1=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if probe 1; then
            echo "result=pass" >>"$GITHUB_OUTPUT"
            echo "davidrydberg.dev check passed: $(cat "$RUNNER_TEMP/result.1")" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "First check failed ($(cat "$RUNNER_TEMP/verdict.1")); retrying in 60s"
          sleep 60
          ts2=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if probe 2; then
            echo "result=pass" >>"$GITHUB_OUTPUT"
            echo "Retry passed, so this was a single blip and not an outage: $(cat "$RUNNER_TEMP/result.2")" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "URL: $URL"
            echo
            echo "Two consecutive failed checks, 60s apart. Outage started at the first: $ts1."
            echo
            describe 1 "$ts1"
            describe 2 "$ts2"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >"$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >>"$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report.md"
          {
            echo "result=fail"
            echo "outage_start=$ts1"
          } >>"$GITHUB_OUTPUT"

      - name: Open or update the outage issue
        if: steps.check.outputs.result == 'fail'
        env:
          OUTAGE_START: ${{ steps.check.outputs.outage_start }}
        run: |
          set -eu
          gh label list --search outage --json name --jq '.[].name' | grep -qx outage \
            || gh label create outage --color B60205 \
                 --description 'davidrydberg.dev failed its uptime check'
          open=$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/report.md"
            echo "Commented on open outage issue #$open"
          else
            gh issue create --label outage \
              --title "Outage: davidrydberg.dev $OUTAGE_START" \
              --body-file "$RUNNER_TEMP/report.md"
          fi

      - name: Close any open outage issue
        if: steps.check.outputs.result == 'pass'
        run: |
          set -eu
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for n in $(gh issue list --label outage --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "recovered $now"
            echo "Closed outage issue #$n"
          done

      # The run goes red on a confirmed outage, so GitHub's failed-workflow
      # notification and the Actions run list both show it, on top of the issue.
      - name: Fail the run on a confirmed outage
        if: steps.check.outputs.result == 'fail'
        run: |
          echo "::error::davidrydberg.dev failed two consecutive checks"
          exit 1
