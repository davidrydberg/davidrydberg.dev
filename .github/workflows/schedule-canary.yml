name: Schedule canary

# Diagnostic for DAV-21: does GitHub fire `schedule` events for this repo at
# all? Deliberately separate from uptime.yml and on an off-peak minute (:17),
# so a missing uptime run can be attributed to the repo or to that workflow.
# No secrets, read-only. Rollback: delete this file.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "schedule canary fired at $(date -u +%Y-%m-%dT%H:%M:%SZ), event=${{ github.event_name }}"
